<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="#07040f"/>
  <rect width="900" height="220" fill="url(#glow1)"/>
  <rect width="900" height="220" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g stroke="#a855f7" stroke-opacity="0.06">
    <line x1="0" y1="55" x2="900" y2="55"/>
    <line x1="0" y1="110" x2="900" y2="110"/>
    <line x1="0" y1="165" x2="900" y2="165"/>
    <line x1="150" y1="0" x2="150" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="750" y1="0" x2="750" y2="220"/>
  </g>

  <text x="450" y="112" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="10" fill="url(#titleGrad)" filter="url(#softGlow)">
    INES ALLAG
  </text>

  <rect x="300" y="134" width="300" height="2" fill="url(#lineGrad)"/>

  <text x="450" y="164" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="14" letter-spacing="4" fill="#c4b5fd" fill-opacity="0.85">
    CYBERSECURITY // SYSTEMS // NETWORKS
  </text>

  <text x="450" y="192" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="11" letter-spacing="2" fill="#7c3aed" fill-opacity="0.7">
    L3 @ CY TECH — BUILDING TOWARD AN APPRENTICESHIP
  </text>
</svg>
